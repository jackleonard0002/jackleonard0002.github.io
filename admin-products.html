<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin product manager for Whimsical Wands." />
  <title>Admin Products | Whimsical Wands</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/images/icon.png" />
</head>
<body data-page="admin" data-footer-note="Admin access is restricted to allowed Google accounts.">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div data-site-header></div>
  <script src="js/layout.js?v=20260602a"></script>

  <main id="main-content" class="section">
    <div class="container">
      <h1>Admin Dashboard</h1>
      <p class="section-intro">Manage products, review orders, and track basic product analytics.</p>

      <div id="admin-status" class="admin-status">Checking admin access...</div>

      <section id="admin-dashboard" class="admin-layout" hidden>
        <nav class="admin-subnav" aria-label="Admin sections">
          <a class="admin-subnav-link" href="admin.html" data-admin-page-link="theme">Theme Studio</a>
          <a class="admin-subnav-link" href="admin-products.html" data-admin-page-link="products">Product Manager</a>
          <a class="admin-subnav-link" href="admin-orders.html" data-admin-page-link="orders">Orders</a>
          <a class="admin-subnav-link" href="admin-analytics.html" data-admin-page-link="analytics">Analytics</a>
        </nav>

        <article class="admin-panel admin-section-panel">
          <h2>Product Manager</h2>
          <div class="admin-transfer-controls">
            <button id="products-export" class="auth-btn" type="button">Download Backup ZIP (Products + Assets)</button>
            <label class="auth-btn" for="products-import-file">Choose Backup ZIP or JSON</label>
            <input id="products-import-file" type="file" accept="application/zip,.zip,application/json,.json" />
            <button id="products-import" class="auth-btn auth-btn-secondary" type="button">Upload Backup</button>
            <p id="products-transfer-status" class="upload-status" aria-live="polite"></p>
          </div>

          <form id="product-form" class="admin-form">
            <input id="product-edit-id" type="hidden" />

            <label for="product-id">Product ID</label>
            <input id="product-id" name="product-id" type="text" placeholder="Auto-generated from name if left blank" />

            <label for="product-name">Name</label>
            <input id="product-name" name="product-name" type="text" required />

            <label for="product-category">Category</label>
            <select id="product-category" name="product-category" required>
              <option value="wand">wand</option>
              <option value="painting">painting</option>
            </select>

            <label for="product-price">Price (GBP)</label>
            <input id="product-price" name="product-price" type="number" min="0" step="0.01" required />

            <label for="product-images">Image Paths (one per line or comma-separated)</label>
            <textarea id="product-images" name="product-images" rows="3" required></textarea>

            <div class="image-upload-row">
              <label for="product-image-files">Upload Images</label>
              <input id="product-image-files" name="product-image-files" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
              <button id="product-upload-images" class="auth-btn" type="button">Upload selected images</button>
              <p id="product-upload-status" class="upload-status" aria-live="polite"></p>
            </div>

            <label for="product-description">Description</label>
            <textarea id="product-description" name="product-description" rows="3" required></textarea>

            <label for="product-alt">Image Alt Text</label>
            <input id="product-alt" name="product-alt" type="text" required />

            <div class="admin-form-actions">
              <button class="btn btn-primary" type="submit">Save Product</button>
              <button id="product-reset" class="auth-btn auth-btn-secondary" type="button">Reset</button>
            </div>
          </form>

          <div id="product-list" class="admin-list" aria-live="polite"></div>
        </article>
      </section>
    </div>
  </main>

  <div data-site-footer></div>

  <script type="module" src="js/auth.js?v=20260601j"></script>
  <script src="js/currency.js?v=20260601j"></script>
  <script src="js/products.js?v=20260601j"></script>
  <script src="js/main.js?v=20260603b"></script>
  <script src="js/admin.js?v=20260602d"></script>
</body>
</html>
